services:
  postgres:
    image: postgres:16-alpine
    container_name: creatify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: creatify_user
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: creatify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: creatify_postgres_data

